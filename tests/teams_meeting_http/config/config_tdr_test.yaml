# ============================================================
#  TDR (Tax Data Repository) — Release Automation Config
#  FY 2026
# ============================================================
#
# NOTE — Prod Deployment dates:
#   The official release schedule lists the "go/no-go" milestone date (e.g. Thu).
#   The actual PROD deployment window is 08:00–11:00 IST the FOLLOWING day (e.g. Fri).
#   Dates in the schedule below reflect the actual execution date (+1 day from
#   the official schedule), so that calendar invites and ADO sprints are correct.

power_automate:
  url: "https://make.powerautomate.com/environments/Default-62ccb864-6a1a-4b5d-8e1c-397dec1a8258/flows"

  # ── Shared cancel flow ───────────────────────────────────────
  # One single Power Automate flow handles cancellation for ALL 19 meetings.
  # It receives subject + start_datetime, finds the matching calendar event,
  # and deletes it. Paste the HTTP trigger URL here once the flow is set up,
  # and it will automatically apply to every meeting below.
  cancel_flow_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/339ea7a91ded461d8d3fd3923c2e69b8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=wnXCQsKBB6N5gVzM-TsPIde_e-sZ_N7RfS5CN3_xfyQ"

# -----------------------------------------------------------------------------
# Attendee Groups  (test — two groups only)
# -----------------------------------------------------------------------------
attendee_groups:
  group_tdr_team:
    - radhakrishna.pachipulusu@thomsonreuters.com
    - AashishMono.Kotte@thomsonreuters.com
  group_tdr_optional:
    - Dhruv.Rajpurohit@thomsonreuters.com

# ── Time slots (HH:MM:SS) ────────────────────────────────────
time_slots:
  slot_30_1230:  { start: "12:30:00", end: "13:00:00", duration: 30  }
  slot_30_1700:  { start: "17:00:00", end: "17:30:00", duration: 30  }
  slot_30_1730:  { start: "17:30:00", end: "18:00:00", duration: 30  }
  slot_30_1830:  { start: "18:30:00", end: "19:00:00", duration: 30  }
  slot_30_2000:  { start: "20:00:00", end: "20:30:00", duration: 30  }
  slot_180_0800: { start: "08:00:00", end: "11:00:00", duration: 180 }

# ── Form field sets ──────────────────────────────────────────
# Field order matters — Power Automate fills them in this sequence.
form_field_sets:
  basic:
    - subject
    - release_version
    - description
    - start_date
    - start_time
    - end_date
    - end_time
    - start_datetime
    - end_datetime
    - required_attendees

  basic_reorder:          # subject & attendees filled before dates
    - subject
    - release_version
    - required_attendees
    - description
    - start_date
    - start_time
    - end_date
    - end_time
    - start_datetime
    - end_datetime

  with_urls:
    - subject
    - release_version
    - description
    - start_date
    - start_time
    - end_date
    - end_time
    - start_datetime
    - end_datetime
    - release_schedule_url
    - release_readiness_url
    - required_attendees
    - optional_attendees

  with_all_urls:          # attendees & optional before dates
    - subject
    - release_version
    - required_attendees
    - optional_attendees
    - description
    - start_date
    - start_time
    - end_date
    - end_time
    - start_datetime
    - end_datetime
    - release_schedule_url
    - release_readiness_url
    - release_notes_url
    - security_scorecard_url

meetings:
  Determination Enterprise Cloud Component Details:
    flow_name: "TDR->01->Determination Enterprise Cloud Component Details"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/a358462330e8453e819cf14e0e7b4cef/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=2J_jiwrjAuZKSLgX2ZuNxC-STiFkrpVBoCqJyKGQCpc"  # TODO: paste HTTP trigger URL from Power Automate
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Meeting] - {release_number} | Determination Enterprise Cloud Component Details"
    description_template: |-
      <b>Agenda:</b> Obtain Determination Enterprise Cloud Component Details<br><br>
      &#x2022; Obtain these details via email from Nazeer on the day of successful production deployment of Determination Enterprise.
    time_slot: $slot_30_1230
    required_attendees: $group_tdr_team
    form_fields: $basic

  SDI & GPG Details:
    flow_name: "TDR->02->SDI & GPG Details"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fdf92663e7c0457083b3121cac213dca/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=KJBf9fcck6XTad0ogdx9-Rdb5V0MqJjxy4OH7ifs6AM"
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Meeting] - {release_number} | SDI & GPG Details"
    description_template: |-
      <b>Agenda:</b> Obtain SDI & CCA & GPG Details<br><br>
      &#x2022; Receive an email from Nazeer on the "code freeze" day of {release_number} for the Determination Enterprise Cloud Release Schedule.<br>
      &#x2022; Send an email to TDR team for their confirmation.
    time_slot: $slot_30_1230
    required_attendees: $group_tdr_team
    form_fields: $basic
    
  CCA Details:
    flow_name: "TDR->03->CCA Details"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/f6e22e3ff7664d23ae99514c5be58a6f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=DofQpXmsWNtU7Kjp9kpu9sDTDLciErmDLpC6ispUqGQ"  # TODO: paste HTTP trigger URL from Power Automate
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Meeting] - {release_number} | CCA Details"
    description_template: |-
      <b>Agenda:</b> Obtain CCA Details<br><br>
      &#x2022; Receive an email from Akshay on the "code freeze" day of CCA application.<br>
      &#x2022; Send an email to TDR team for their confirmation.
    time_slot: $slot_30_1230
    required_attendees: $group_tdr_team
    form_fields: $basic

  Code Freeze:
    flow_name: "TDR->04->Code Freeze"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/e522a329ca7142b69ad893897d155ce8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=kOifnY1G4XldrzV91MoocN4iFWGb3uQK3v-N6wRnj0U"
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Reminder] - {release_number} | Code Freeze"
    description_template: |-
      <b>Meeting Agenda:</b><br><br>
      <b>I. Inform Sandeep in Release Branch Creation meeting</b><br>
      &#x2022; Radha - On the day of code freeze, inform Sandeep in "Release Branch Creation" meeting to merge the changes in develop branch to release branch, since today is the last day of code freeze and tomorrow, a new release branch (<b>{release_branch_name}</b>) would be created.
    time_slot: $slot_30_1230
    required_attendees: $group_tdr_team
    form_fields: $basic

  Release Branch:
    flow_name: "TDR->05->Release Branch Creation"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/26c11ccad6154ce39b3644d6f92e96bf/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hlZxTLuhiUIi_0VDoLNkYesBoZ17rCfEoGBLB2xsZIE"
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Placeholder] - {release_number} | Create Release Branch"
    description_template: |-
      <b>Meeting Agenda:</b> TDR Release Branch Creation<br><br>
      <b>I. UI Release Branch Creation</b><br>
      &#x2022; Radha - Create a new release branch for the UI component from the develop branch.<br>
      &#x2022; Branch Name: <b>{release_branch_name}</b><br><br>
      <b>II. Database Release Branch Creation</b><br>
      &#x2022; Chinnappan Dharmalingam would create the corresponding database release branch.
    time_slot: $slot_30_1230
    required_attendees: $group_tdr_team
    form_fields: $basic

  Release Scope Review:
    flow_name: "TDR->06->Release Scope Review Meeting"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/5989167879b740ec817963a3399e48da/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=vaqASNsXDDTu7UB7QuO1Haa6eyCXeXQBLahInfp7sWU"
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Meeting] - {release_number} | Release Scope Review Meeting"
    description_template: |-
      <b>Agenda:</b><br>
      &#x2022; To review whether there is a scope for {release_number}.<br>
      &#x2022; If yes, then go through the Release Requirement checklist.<br><br>
      <b>Related Documents</b><br>
      Release Schedule: <a href="{release_schedule_url}">Tax Data Repository Cloud Release Schedule - FY 2026</a><br>
      Release Readiness: <a href="{release_readiness_url}">Tax Data Repository Cloud Release Readiness - {release_number}</a>
    time_slot: $slot_30_2000
    required_attendees: $group_tdr_team
    optional_attendees: $group_tdr_optional
    form_fields: $with_urls

  QA Sign-off:
    flow_name: "TDR->07->QA Sign-Off"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/b2f8773b0dd54e38b8ef9802df2709f5/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=XQmHm3D0Bm6m8bW10oFVHolcZq-yh49Wwg6XDccxml0"
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Reminder] - {release_number} | QA Sign-Off"
    description_template: |-
      <b>Agenda:</b><br>
      &#x2022; QA Sign-off: QA Team to provide final sign-off via email only.<br><br>
      <b>Note:</b> This meeting invitation is for communication and informational purposes only. Team members are not expected to attend.
    time_slot: $slot_30_1730
    required_attendees: $group_tdr_team
    form_fields: $basic
  
  Generate Security Scorecard:
    flow_name: "TDR->08->Generate Security Scorecard"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/6a404b64816c4bbdb4949cdb16d6681e/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=LXztW9NmPYmNhDzX13nGVPVjbuX4Ec1k_WRnXtl9yj8"
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Reminder] - {release_number} | Generate Security Scorecard"
    description_template: |-
      <b>Agenda:</b> Security Score Card Generation for Release {release_version}<br><br>
      <b>Scope:</b><br>
      &#x2022; Generation of the security score card after QA sign-off and before UAT deployment, in line with existing QA and UAT processes.<br>
      &#x2022; Upload of the generated security score card to security score card SharePoint.<br><br>
      <b>Reference Documentation:</b><br>
      &#x2022; Review the procedure described in "1.0 Security Score Card - TDR - SYNK Security Score card report generation Knowledge sharing to Radha" page for detailed steps and standards.
    time_slot: $slot_30_1730
    required_attendees: $group_tdr_team
    form_fields: $basic

  UAT Readiness:
    flow_name: "TDR->09->UAT Release Readiness Meeting"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/02d1e88fe1d64d2596695aa616aeef2f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=uNvZbj93Qtefg_w_E6enOTYiT6afrCQO8g16HoXqXSY"
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Meeting] - {release_number} | UAT Release Readiness Meeting"
    description_template: |-
      <b>Agenda:</b><br>
      &#x2022; To understand whether we are prepared for the UAT deployment.<br>
      &#x2022; To go through the Release Readiness checklist.<br>
      &#x2022; To receive QA Team signoff.<br>
      &#x2022; To receive the Go AHEAD from all stakeholders before proceeding to UAT deployment.<br><br>
      <b>Related Documents</b><br>
      Release Schedule: <a href="{release_schedule_url}">Tax Data Repository Cloud Release Schedule - FY 2026</a><br>
      Release Readiness: <a href="{release_readiness_url}">Tax Data Repository Cloud Release Readiness - {release_number}</a><br>
      Release Notes: <a href="{release_notes_url}">Tax Data Repository Cloud Release Notes - {release_number}</a><br>
      Security Score Card: <a href="{security_scorecard_url}">Tax Data Repository Cloud Security Score Card - FY 2026</a>
    time_slot: $slot_30_2000
    required_attendees: $group_tdr_team
    optional_attendees: $group_tdr_optional
    form_fields: $with_all_urls

  UAT Deployment:
    flow_name: "TDR->10->UAT Deployment"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/c58bf333c7ce4a2da2694bf287583b95/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=jQRFyvLsJaMaUl4Xf9umUnVj5d_Op9scmXIzRA1y2cQ"
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Deployment] - {release_number} | UAT Deployment"
    description_template: |-
      <b>Agenda:</b><br>
      <b>UAT Deployment:</b><br><br>
      &#x2022; Database Team to perform deployment.<br>
      &#x2022; UI Team to perform deployment after Database Team's completion.<br>
      &#x2022; Deployment Confirmation: Both Database and UI Teams to confirm completion of their respective deployment phases.<br>
      &#x2022; Regression Testing: QA Team to perform regression testing once UAT deployment is fully confirmed.<br><br>
      <b>Note:</b> This meeting invitation is for communication and informational purposes only. Team members are not expected to attend.
    time_slot: $slot_30_1230
    required_attendees: $group_tdr_team
    form_fields: $basic_reorder

  UAT Sign-off:
    flow_name: "TDR->11->UAT Sign-Off"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/8ac6d7b05071497f994fbc697ae69836/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=rBs_OHmVYjoOhetHrjKXoS_DaIlL73d5joI7XwkPMUc"
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Reminder] - {release_number} | UAT Sign-Off"
    description_template: |-
      <b>Agenda:</b><br>
      &#x2022; UAT Sign-off: QA Team to provide final sign-off via email only.<br><br>
      <b>Note:</b> This meeting invitation is for communication and informational purposes only. Team members are not expected to attend.
    time_slot: $slot_30_1730
    required_attendees: $group_tdr_team
    form_fields: $basic

  PROD Readiness:
    flow_name: "TDR->12->PROD Release Readiness Meeting"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/e97bb3f10f2546b2a0907143c2344399/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=PeKsCOAooiyegUNwUUfNaFnDXgAHcbUufzRGZb-Rdk8"
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Meeting] - {release_number} | PROD Release Readiness Meeting"
    description_template: |-
      <b>Agenda:</b><br>
      &#x2022; To understand whether we are prepared for the PROD deployment.<br>
      &#x2022; To go through the Release Readiness checklist.<br>
      &#x2022; To receive the Go AHEAD from all stakeholders before proceeding to PROD deployment.<br><br>
      <b>Related Documents</b><br>
      Release Schedule: <a href="{release_schedule_url}">Tax Data Repository Cloud Release Schedule - FY 2026</a><br>
      Release Readiness: <a href="{release_readiness_url}">Tax Data Repository Cloud Release Readiness - {release_number}</a><br>
      Release Notes: <a href="{release_notes_url}">Tax Data Repository Cloud Release Notes - {release_number}</a><br>
      Security Score Card: <a href="{security_scorecard_url}">Tax Data Repository Cloud Security Score Card - FY 2026</a>
    time_slot: $slot_30_2000
    required_attendees: $group_tdr_team
    optional_attendees: $group_tdr_optional
    form_fields: $with_all_urls

  Prod Deployment:
    flow_name: "TDR->13->Prod Deployment"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/b493836d1b7a4711a3b831b3611cf1e4/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=uuBNgffnhdrjBPYFIP8mzh-VHKKNE_DSEFGyfZAV1Rk"
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Deployment] - {release_number} | Prod Deployment"
    description_template: |-
      <b>Agenda:</b><br>
      <b>PROD Deployment:</b><br><br>
      <b>Checklist:</b><br>
      &#x2022; Confirmation from Release team<br>
      &#x2022; Confirmation from DB Team<br>
      &#x2022; Release tag created in GitHub<br>
      &#x2022; Latest TDR files pulled in PROD server<br>
      &#x2022; Deployment of release branch in PROD<br>
      &#x2022; All Nodes are up and running<br>
      &#x2022; Validate the CI Template versions<br>
      &#x2022; TDR UI is loading after deployment<br><br>
      &#x2022; Database Team to perform deployment.<br>
      &#x2022; UI Team to perform deployment after Database Team's completion.<br>
      &#x2022; Deployment Confirmation: Both Database and UI Teams to confirm completion of their respective deployment phases.<br>
      &#x2022; Smoke Testing: QA Team to perform smoke testing once PROD deployment is fully confirmed.<br><br>
      <b>Note:</b> This meeting invitation is for communication and informational purposes only. Team members are not expected to attend.
    time_slot: $slot_180_0800
    required_attendees: $group_tdr_team
    form_fields: $basic_reorder

  Prod Sign-off & Data Backup Change Creation:
    flow_name: "TDR->14->Prod Sign-off & Data Backup Change Creation"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/34b5e6d5795346d8b8f0f0704968b5c8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=uhR44Ay2G2F_gl73s0CcL91HFOIRXioZMvcGQvBa8GA"
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Reminder] - {release_number} | Prod Sign-off & Data Backup Change Creation"
    description_template: |-
      <b>Agenda:</b> Create Change Request to Generate PROD Data Backup<br><br>
      <b>I. Purpose of Meeting:</b><br>
      This meeting serves as a communication and informational session regarding the creation of a change request for data backup. Team members are not expected to attend this meeting; it is for informational purposes only.<br><br>
      <b>II. Action Items for Release Management Team:</b><br>
      &#x2022; <b>Create Change Request for Dump File Generation:</b><br>
      As a Release Engineer, create a change request for generating dump files from the production instance after the production deployment.<br>
      &#x2022; <b>Assign Change Request:</b><br>
      Assign the newly created change request to Dharmalingam.<br>
      &#x2022; <b>Schedule Follow-Up Meeting:</b><br>
      Ensure a follow-up meeting is scheduled to discuss the progress and completion of this change request.
    time_slot: $slot_30_1700
    required_attendees: $group_tdr_team
    form_fields: $basic_reorder

  Generate PROD Data Backup:
    flow_name: "TDR->15->Generate PROD Data Backup"
    schedule_column: GENERATE_DUMP_PROD
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/7881b47305a74987b886e107c2c82ece/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=x7r8MTuBfqb3IaAa6EMhRb_nkyZ55t1O7Pf69-qfbLQ"
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Data Refresh] - {release_number} | Generate PROD Data Backup"
    description_template: |-
      <b>Agenda: Generate PROD Data Backup for UAT/QA Data Refresh</b><br><br>
      <b>I. Purpose of Meeting:</b><br>
      &#x2022; This meeting serves as a communication and informational session regarding the creation of a change request for data backup. Team members are not expected to attend this meeting; it is for informational purposes only.<br><br>
      <b>II. Action Items for TDR Team</b> (Venkat Sai Vetcha - Vetcha.Venkatasai@thomsonreuters.com):<br>
      &#x2022; Generate production dump files on the production instance.<br>
      &#x2022; Once completed, close the associated ctask.<br>
      &#x2022; Update the status of the ctask in the meeting chat window.<br><br>
      <b>III. Action Items for Release Management Team:</b><br>
      &#x2022; Ensure a change request is created.<br>
      &#x2022; Ensure a follow-up meeting is scheduled to discuss the progress and completion of this change request.<br>
      &#x2022; Close the change request once all associated tasks are complete.
    time_slot: $slot_30_1230
    required_attendees: $group_tdr_team
    form_fields: $basic_reorder

  RK UAT Change Creation:
    flow_name: "TDR->16->RK UAT Change Creation"
    trigger_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/11091166d7cb42e79b45d92acca8bd19/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=hALoYNzoemCOleVcNnpuL4amZthJIsnXth7Wk5DS5Hc"
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Reminder] - {release_number} | RK UAT Change Creation"
    description_template: |-
      <b>Agenda:</b> UAT Data Refresh Change Request Creation Meeting<br><br>
      <b>I. Purpose of Meeting:</b><br>
      This meeting serves as a communication and informational session regarding the creation of a change request for UAT data refresh. Team members are not expected to attend this meeting; it is for informational purposes only.<br><br>
      <b>II. Action Items for Release Management Team:</b><br>
      &#x2022; <b>a) Create Change Request for UAT Data Refresh:</b><br>
      As a Release Engineer, create a change request for UAT Data Refresh to be performed after the production deployment.<br>
      &#x2022; <b>b) Assign Change Request:</b><br>
      Assign the newly created change request to Dharmalingam.<br>
      Assign the newly created change request to the Oracle Support Team.<br>
      &#x2022; <b>c) Schedule Follow-Up Meeting:</b><br>
