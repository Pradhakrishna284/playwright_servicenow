# ============================================================
#  CRE (Content Rate Extract) — Release Automation Config
#  FY 2026
# ============================================================
#
# NOTE — Prod Deployment dates:
#   The official release schedule lists the "go/no-go" milestone date.
#   The actual PROD deployment window is 16:20–23:50 IST on the scheduled day.
#   Dates in the schedule below reflect the actual execution dates so that
#   calendar invites and ADO sprints are correct.

power_automate:
  url: "https://make.powerautomate.com/environments/Default-62ccb864-6a1a-4b5d-8e1c-397dec1a8258/flows"

  # ── Shared cancel flow ───────────────────────────────────────
  # One single Power Automate flow handles cancellation for ALL meetings.
  # It receives subject + start_datetime, finds the matching calendar event,
  # and deletes it. Paste the HTTP trigger URL here once the flow is set up,
  # and it will automatically apply to every meeting below.
  cancel_flow_url: ""  # TODO: paste HTTP trigger URL from Power Automate

release_schedule_url: "https://trten.sharepoint.com/sites/IndirectTaxReleaseManagement/SitePages/Content%20Rate%20Extract%20Cloud%20Release%20Schedule%20-%20FY%202026.aspx"

# -----------------------------------------------------------------------------
# Attendee Groups
# -----------------------------------------------------------------------------
attendee_groups:
  group_cre_team:
    - radhakrishna.pachipulusu@thomsonreuters.com
    - AashishMono.Kotte@thomsonreuters.com
  group_cre_optional:
    - Dhruv.Rajpurohit@thomsonreuters.com

# -----------------------------------------------------------------------------
# Time Slots  (start / end / duration in minutes)
# -----------------------------------------------------------------------------
time_slots:
  slot_30_1245:  { start: "12:45:00", end: "13:15:00", duration: 30 }
  slot_30_1600:  { start: "16:00:00", end: "16:30:00", duration: 30 }
  slot_30_1930:  { start: "19:30:00", end: "20:00:00", duration: 30 }
  slot_60_1930:  { start: "19:30:00", end: "20:30:00", duration: 60 }
  slot_450_1620: { start: "16:20:00", end: "23:50:00", duration: 450 }

# -----------------------------------------------------------------------------
# Form Field Sets  (reusable field lists for meeting flows)
# -----------------------------------------------------------------------------
form_field_sets:
  basic:
    - subject
    - description
    - start_date
    - start_time
    - end_date
    - end_time
    - start_datetime
    - end_datetime
    - required_attendees
  basic_with_urls:
    - subject
    - description
    - start_date
    - start_time
    - end_date
    - end_time
    - start_datetime
    - end_datetime
    - release_schedule_url
    - release_readiness_url
    - required_attendees
  with_optional:
    - subject
    - description
    - start_date
    - start_time
    - end_date
    - end_time
    - start_datetime
    - end_datetime
    - release_schedule_url
    - release_readiness_url
    - required_attendees
    - optional_attendees
  with_retro:
    - subject
    - description
    - start_date
    - start_time
    - end_date
    - end_time
    - start_datetime
    - end_datetime
    - release_schedule_url
    - release_readiness_url
    - release_retro_url
    - required_attendees
    - optional_attendees

# -----------------------------------------------------------------------------
# Meeting Definitions
# schedule_column must match a column key in releases.schedule entries below.
# time_slot must match a key in time_slots above.
# -----------------------------------------------------------------------------
meetings:
  Inform CRE team about freeze activities:
    flow_name: "CRE->01->Inform CRE team about freeze activities"
    trigger_url: ""  # TODO: paste HTTP trigger URL from Power Automate
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Reminder] - {release_number} | Inform CRE team about freeze activities"
    description_template: "CRE Team Freeze Notification for {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "Inform CRE team about freeze activities"
    time_slot: $slot_30_1245
    required_attendees: $group_cre_lead
    form_fields: $basic

  CRE freeze activities Meeting:
    flow_name: "CRE->02->Code Freeze Activities Meeting"
    trigger_url: ""  # TODO: paste HTTP trigger URL from Power Automate
    cancel_trigger_url: $cancel_flow_url
    subject_template: "[Meeting] - {release_number} | Code Freeze Activities Meeting"
    description_template: "CRE Team Freeze Notification for {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "Inform CRE team about freeze activities"
    time_slot: $slot_30_1245
    required_attendees: $group_cre_team
    optional_attendees: $group_cre_optional
    form_fields: $with_optional

  Create Change Request:
    flow_name: "CRE->03->Create Change Request"
    trigger_url: ""  # TODO: paste HTTP trigger URL from Power Automate
    cancel_trigger_url: $cancel_flow_url
