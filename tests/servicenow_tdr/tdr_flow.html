<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDR Test Automation Flow</title>
<style>
  :root {
    --bg: #f8f7f4; --bg2: #ffffff;
    --border: rgba(0,0,0,0.10); --border2: rgba(0,0,0,0.18);
    --text-primary: #1a1a18; --text-secondary: #5a5a56; --text-tertiary: #9a9a94;
    --gray-50:#F1EFE8; --gray-600:#5F5E5A; --gray-800:#444441;
    --teal-50:#E1F5EE; --teal-600:#0F6E56; --teal-800:#085041;
    --purple-50:#EEEDFE; --purple-600:#534AB7; --purple-800:#3C3489;
    --amber-50:#FAEEDA; --amber-600:#854F0B; --amber-800:#633806;
    --blue-50:#E6F1FB; --blue-600:#185FA5; --blue-800:#0C447C;
    --coral-50:#FAECE7; --coral-600:#993C1D; --coral-800:#712B13;
    --green-50:#EAF3DE; --green-600:#3B6D11; --green-800:#27500A;
    --red-50:#FCEBEB; --red-600:#A32D2D; --red-800:#791F1F;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#1c1c1a; --bg2:#242422; --border:rgba(255,255,255,0.10); --border2:rgba(255,255,255,0.18);
      --text-primary:#e8e6de; --text-secondary:#a0a09a; --text-tertiary:#60605a;
      --gray-50:#2C2C2A; --gray-600:#B4B2A9; --gray-800:#D3D1C7;
      --teal-50:#04342C; --teal-600:#5DCAA5; --teal-800:#9FE1CB;
      --purple-50:#26215C; --purple-600:#AFA9EC; --purple-800:#CECBF6;
      --amber-50:#412402; --amber-600:#EF9F27; --amber-800:#FAC775;
      --blue-50:#042C53; --blue-600:#85B7EB; --blue-800:#B5D4F4;
      --coral-50:#4A1B0C; --coral-600:#F0997B; --coral-800:#F5C4B3;
      --green-50:#173404; --green-600:#97C459; --green-800:#C0DD97;
      --red-50:#501313; --red-600:#F09595; --red-800:#F7C1C1;
    }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text-primary); font-family:'DM Sans','Segoe UI',system-ui,sans-serif; min-height:100vh; padding:32px 16px 64px; }
  header { max-width:780px; margin:0 auto 32px; }
  header h1 { font-size:22px; font-weight:600; letter-spacing:-0.02em; margin-bottom:4px; }
  header p { font-size:13px; color:var(--text-tertiary); }
  .diagram-wrap { max-width:780px; margin:0 auto; background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:32px 24px; box-shadow:0 2px 16px rgba(0,0,0,0.06); }
  svg { display:block; width:100%; }
  .node { cursor:pointer; } .node:hover rect, .node:hover polygon { opacity:0.82; }
  .phase-label { font-size:10px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; fill:var(--text-tertiary); }
  .phase-line { stroke:var(--border2); stroke-width:0.5; }
  .th { font-family:'DM Sans',system-ui,sans-serif; font-size:13px; font-weight:600; fill:var(--text-primary); }
  .ts { font-family:'DM Sans',system-ui,sans-serif; font-size:11px; font-weight:400; fill:var(--text-secondary); }
  .c-gray rect,.c-gray polygon { fill:var(--gray-50); stroke:var(--gray-600); }
  .c-gray .th { fill:var(--gray-800); } .c-gray .ts { fill:var(--gray-600); }
  .c-teal rect,.c-teal polygon { fill:var(--teal-50); stroke:var(--teal-600); }
  .c-teal .th { fill:var(--teal-800); } .c-teal .ts { fill:var(--teal-600); }
  .c-purple rect,.c-purple polygon { fill:var(--purple-50); stroke:var(--purple-600); }
  .c-purple .th { fill:var(--purple-800); } .c-purple .ts { fill:var(--purple-600); }
  .c-amber rect,.c-amber polygon { fill:var(--amber-50); stroke:var(--amber-600); }
  .c-amber .th { fill:var(--amber-800); } .c-amber .ts { fill:var(--amber-600); }
  .c-blue rect,.c-blue polygon { fill:var(--blue-50); stroke:var(--blue-600); }
  .c-blue .th { fill:var(--blue-800); } .c-blue .ts { fill:var(--blue-600); }
  .c-coral rect,.c-coral polygon { fill:var(--coral-50); stroke:var(--coral-600); }
  .c-coral .th { fill:var(--coral-800); } .c-coral .ts { fill:var(--coral-600); }
  .c-green rect,.c-green polygon { fill:var(--green-50); stroke:var(--green-600); }
  .c-green .th { fill:var(--green-800); } .c-green .ts { fill:var(--green-600); }
  .c-red rect,.c-red polygon { fill:var(--red-50); stroke:var(--red-600); }
  .c-red .th { fill:var(--red-800); } .c-red .ts { fill:var(--red-600); }
  .arr { stroke:var(--border2); stroke-width:1.2; fill:none; }
  #tooltip { position:fixed; background:var(--bg2); border:1px solid var(--border2); border-radius:8px; padding:8px 12px; font-size:12px; color:var(--text-secondary); pointer-events:none; opacity:0; transition:opacity 0.15s; max-width:240px; box-shadow:0 4px 16px rgba(0,0,0,0.12); z-index:100; }
  #tooltip.show { opacity:1; }
  footer { max-width:780px; margin:16px auto 0; font-size:11px; color:var(--text-tertiary); display:flex; gap:20px; flex-wrap:wrap; }
  .legend-item { display:flex; align-items:center; gap:6px; }
  .legend-swatch { width:14px; height:14px; border-radius:3px; border:1px solid; flex-shrink:0; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <h1>TDR Test Automation — End-to-End Flow</h1>
  <p>Playwright · ServiceNow · Sequential execution · Hover nodes for details</p>
</header>
<div class="diagram-wrap">
<svg viewBox="0 0 680 1340" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>TDR test automation end-to-end flow</title>
  <desc>Flowchart: SSO setup, YAML validation, then sequential CR creation for GENERATE_DUMP_PROD, UAT, QA</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- SETUP -->
  <text class="phase-label" x="40" y="38">Setup</text>
  <line class="phase-line" x1="40" y1="44" x2="640" y2="44"/>

  <g class="node c-gray" data-tip="Set $env:RELEASE_VERSION before running. beforeAll() throws immediately if missing.">
    <rect x="200" y="56" width="280" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="72" text-anchor="middle" dominant-baseline="central">Set RELEASE_VERSION env var</text>
    <text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central">e.g. 2026.06.00</text>
  </g>
  <line x1="340" y1="100" x2="340" y2="124" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-teal" data-tip="js-yaml loads tdr_release_schedule.yaml. Zod validates all 3 date fields (DD-MM-YYYY) and buildVersion. Fails fast with a clear field-level error.">
    <rect x="160" y="124" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="144" text-anchor="middle" dominant-baseline="central">Load tdr_release_schedule.yaml</text>
    <text class="ts" x="340" y="162" text-anchor="middle" dominant-baseline="central">Zod validates dates + buildVersion</text>
  </g>
  <line x1="340" y1="180" x2="340" y2="204" class="arr" marker-end="url(#arrow)"/>

  <g class="node" data-tip="Zod safeParse() — on failure, all field paths and messages are printed. No test runs.">
    <polygon points="340,204 420,232 340,260 260,232" style="fill:var(--gray-50);stroke:var(--gray-600);stroke-width:0.5"/>
    <text class="ts" x="340" y="236" text-anchor="middle" dominant-baseline="central" style="fill:var(--text-primary)">Valid?</text>
  </g>
  <line x1="420" y1="232" x2="536" y2="232" class="arr" marker-end="url(#arrow)" style="stroke:#A32D2D"/>
  <text class="ts" x="472" y="224" text-anchor="middle" style="fill:var(--red-600)">No</text>
  <g class="node c-red" data-tip="Throws with clear message listing every bad field and expected format.">
    <rect x="537" y="210" width="100" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="587" y="226" text-anchor="middle" dominant-baseline="central">Throw error</text>
    <text class="ts" x="587" y="244" text-anchor="middle" dominant-baseline="central">Clear message</text>
  </g>
  <line x1="340" y1="260" x2="340" y2="284" class="arr" marker-end="url(#arrow)" style="stroke:#3B6D11"/>
  <text class="ts" x="352" y="276" style="fill:var(--green-600)">Yes</text>

  <g class="node c-teal" data-tip="Date calculations run: getDumpDates(), getUATDates(), getQADates(). Oracle/TDR windows computed from deployment_times in the YAML. TEST_CONFIGURATIONS_ORDERED array set.">
    <rect x="160" y="284" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="304" text-anchor="middle" dominant-baseline="central">Build TEST_CONFIGURATIONS_ORDERED</text>
    <text class="ts" x="340" y="322" text-anchor="middle" dominant-baseline="central">GENERATE_DUMP_PROD · UAT · QA</text>
  </g>
  <line x1="340" y1="340" x2="340" y2="364" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-purple" data-tip="Runs once. Navigates to SSO, fills credentials from .env, waits up to 2 min for PingID MFA, saves session to auth_servicenow.json (valid 8 hrs).">
    <rect x="160" y="364" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="384" text-anchor="middle" dominant-baseline="central">SSO setup (runs once)</text>
    <text class="ts" x="340" y="402" text-anchor="middle" dominant-baseline="central">Login → PingID MFA → save auth_servicenow.json (8 h TTL)</text>
  </g>

  <!-- SEQUENTIAL EXECUTION -->
  <line x1="340" y1="420" x2="340" y2="444" class="arr" marker-end="url(#arrow)"/>
  <text class="phase-label" x="40" y="462">Sequential execution  (GENERATE_DUMP_PROD → UAT → QA)</text>
  <line class="phase-line" x1="40" y1="468" x2="640" y2="468"/>

  <g class="node c-amber" data-tip="Step 1 of 3. Generates PROD_SBXTAX.dmp and PROD_CONTENT.dmp in cdp0797a1. Must complete before UAT refresh can begin.">
    <rect x="160" y="476" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="496" text-anchor="middle" dominant-baseline="central">1. GENERATE_DUMP_PROD</text>
    <text class="ts" x="340" y="514" text-anchor="middle" dominant-baseline="central">PROD (cdp0797a1) · CTasks: Content + RM</text>
  </g>
  <line x1="340" y1="532" x2="340" y2="552" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-blue" data-tip="Step 2 of 3. Restores PROD dump files to UAT instance (cdu0791a1). Oracle runs 4 days, TDR team validates next 2 business days. CTasks: Oracle + Content + RM.">
    <rect x="160" y="552" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="572" text-anchor="middle" dominant-baseline="central">2. UAT Data Refresh</text>
    <text class="ts" x="340" y="590" text-anchor="middle" dominant-baseline="central">UAT (cdu0791a1) · CTasks: Oracle + Content + RM</text>
  </g>
  <line x1="340" y1="608" x2="340" y2="628" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-coral" data-tip="Step 3 of 3. Restores PROD dump files to QA instance (cdq0782a1). Files transferred during UAT refresh. Oracle runs 2 days, TDR team validates same day. CTasks: Oracle + Content + RM.">
    <rect x="160" y="628" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="648" text-anchor="middle" dominant-baseline="central">3. QA Data Refresh</text>
    <text class="ts" x="340" y="666" text-anchor="middle" dominant-baseline="central">QA (cdq0782a1) · CTasks: Oracle + Content + RM</text>
  </g>

  <!-- PER-CONFIG STEPS -->
  <line x1="340" y1="684" x2="340" y2="708" class="arr" marker-end="url(#arrow)"/>
  <text class="phase-label" x="40" y="726">Per-config test steps  (same 11 steps for each config)</text>
  <line class="phase-line" x1="40" y1="732" x2="640" y2="732"/>

  <g class="node c-gray" data-tip="storageState injects auth_servicenow.json — no SSO redirect occurs.">
    <rect x="160" y="740" width="360" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="756" text-anchor="middle" dominant-baseline="central">1. Reuse auth_servicenow.json session</text>
    <text class="ts" x="340" y="774" text-anchor="middle" dominant-baseline="central">storageState fixture — no per-test login</text>
  </g>
  <line x1="340" y1="784" x2="340" y2="804" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-purple" data-tip="Opens All menu, scrolls nav until Create New is visible, clicks it.">
    <rect x="160" y="804" width="360" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="820" text-anchor="middle" dominant-baseline="central">2. Navigate → Create New</text>
    <text class="ts" x="340" y="838" text-anchor="middle" dominant-baseline="central">All menu → Change → Create New</text>
  </g>
  <line x1="340" y1="848" x2="340" y2="868" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-purple" data-tip="Clicks Normal in the change model selector iframe.">
    <rect x="160" y="868" width="360" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="884" text-anchor="middle" dominant-baseline="central">3. Select Normal change model</text>
    <text class="ts" x="340" y="902" text-anchor="middle" dominant-baseline="central">Click Normal in change model iframe</text>
  </g>
  <line x1="340" y1="912" x2="340" y2="932" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-teal" data-tip="fillMainForm + fillPlanningTab + fillScheduleTab. Config item is environment-specific (cdp/cdu/cdq). CR number captured before submit, saved to change_request_registry.json.">
    <rect x="160" y="932" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="952" text-anchor="middle" dominant-baseline="central">4–5. Fill + submit CR form</text>
    <text class="ts" x="340" y="970" text-anchor="middle" dominant-baseline="central">Category, config item, dates, descriptions, groups</text>
  </g>
  <line x1="340" y1="988" x2="340" y2="1008" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-purple" data-tip="Navigates to Open CRs list, searches by CR number, asserts row visible, opens CR detail.">
    <rect x="160" y="1008" width="360" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1024" text-anchor="middle" dominant-baseline="central">6–8. Redirect → verify CR in list</text>
    <text class="ts" x="340" y="1042" text-anchor="middle" dominant-baseline="central">Search by CR number, open detail record</text>
  </g>
  <line x1="340" y1="1052" x2="340" y2="1072" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-teal" data-tip="Loops through ctaskConfigs array. Each CTask has its own assignment group, assigned person, and dates. ORACLE-SUPPORT-TR has no assigned person (empty string).">
    <rect x="160" y="1072" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1092" text-anchor="middle" dominant-baseline="central">9. Create CTasks</text>
    <text class="ts" x="340" y="1110" text-anchor="middle" dominant-baseline="central">Oracle · Content · RM — each with own dates</text>
  </g>
  <line x1="340" y1="1128" x2="340" y2="1148" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-amber" data-tip="createRiskAssessmentTask() — polls all frames until the assessment form (5+ selects) appears, then fills all 9 questions.">
    <rect x="160" y="1148" width="360" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1164" text-anchor="middle" dominant-baseline="central">10. Create Risk Assessment</text>
    <text class="ts" x="340" y="1182" text-anchor="middle" dominant-baseline="central">9 questions auto-filled</text>
  </g>
  <line x1="340" y1="1192" x2="340" y2="1212" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-green" data-tip="Tries button#state_model_request_assess_approval. Falls back to moveToAssess() via page.evaluate() if the button click fails.">
    <rect x="160" y="1212" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1232" text-anchor="middle" dominant-baseline="central">11. Submit for Assess</text>
    <text class="ts" x="340" y="1250" text-anchor="middle" dominant-baseline="central">Button click → JS fallback (moveToAssess)</text>
  </g>
  <line x1="340" y1="1268" x2="340" y2="1288" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-gray" data-tip="ChangeRequestStorage.save() writes crNumber, timestamp, configName to change_request_registry.json.">
    <rect x="160" y="1288" width="360" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1304" text-anchor="middle" dominant-baseline="central">Save CR to registry</text>
    <text class="ts" x="340" y="1322" text-anchor="middle" dominant-baseline="central">change_request_registry.json</text>
  </g>
</svg>
</div>

<footer>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--teal-50);border-color:var(--teal-600)"></span>Form / data actions</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--purple-50);border-color:var(--purple-600)"></span>Navigation</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--amber-50);border-color:var(--amber-600)"></span>GENERATE_DUMP_PROD</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--blue-50);border-color:var(--blue-600)"></span>UAT refresh</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--coral-50);border-color:var(--coral-600)"></span>QA refresh</span>
  <span class="legend-item"><span class="legend-swatch" style="background:var(--green-50);border-color:var(--green-600)"></span>Final state change</span>
</footer>

<div id="tooltip"></div>
<script>
  const tip = document.getElementById('tooltip');
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', () => { tip.textContent = el.dataset.tip; tip.classList.add('show'); });
    el.addEventListener('mousemove', e => { tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-8)+'px'; });
    el.addEventListener('mouseleave', () => tip.classList.remove('show'));
  });
</script>
</body>
</html>
