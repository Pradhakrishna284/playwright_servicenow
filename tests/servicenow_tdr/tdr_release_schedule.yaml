# ─────────────────────────────────────────────────────────────────────────────
# TDR Release Schedule — Data Refresh Windows
# ─────────────────────────────────────────────────────────────────────────────
#
# OWNER:    Release Management team
# UPDATED:  When new sprint dates are confirmed
#
# RULES:
#   - Date format MUST be DD-MM-YYYY
#   - UAT & QA Data refresh activities begin after PROD sign off
#   - generateDumpProd -- dump generation start date from PROD (also UAT/QA data backup date)
#   - uatDataRefresh   -- Oracle Support start date for UAT refresh
#   - qaDataRefresh    -- Oracle Support start date for QA refresh
#   - Do NOT change deployment_times without consulting the RM team
#
# ─────────────────────────────────────────────────────────────────────────────

deployment_times:
  # QA refresh: Oracle runs 2 consecutive days (including weekends)
  qa_oracle_start:   "08:00:00"
  qa_oracle_days:    2
  qa_tdr_start:      "12:00:00"
  qa_tdr_end:        "23:30:00"

  # UAT refresh: Oracle runs 4 consecutive days (including weekends)
  uat_oracle_start:  "08:00:00"
  uat_oracle_days:   4
  uat_tdr_start:     "12:00:00"   # TDR starts next business day after Oracle ends
  uat_tdr_end:       "21:00:00"   # TDR runs 2 business days

  # PROD dump generation: starts at noon, ends 9 PM next day (~33.5 hrs)
  dump_start:        "12:00:00"
  dump_end_next_day: "21:00:00"

