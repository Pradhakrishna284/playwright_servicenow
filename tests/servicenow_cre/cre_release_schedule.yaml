# =============================================================================
# CRE Master Configuration — Single Source of Truth
# =============================================================================
#
# OWNER:   Release Management team
# COVERS:  Teams meeting automation  +  Playwright CR creation  +  CR registry
#
# RULES:
#   • Deployment dates:  DD-MM-YYYY  (ServiceNow date input format)
#   • Meeting dates:     YYYY-MM-DD  (Power Automate / Python format)
#   • Do NOT change deployment_times without consulting the RM team
#   • To add a release: copy any schedule block, update all dates + buildVersion
#
# USAGE:
#   Teams meetings :  python teams_meeting.py --project CRE --release-version 2026.05.00
#   CR creation    :  $env:RELEASE_VERSION="2026.05.00"; npx playwright test CRE/changeRequest.spec.ts --headed
# =============================================================================


# -----------------------------------------------------------------------------
# Power Automate
# -----------------------------------------------------------------------------
power_automate:
  url: "https://make.powerautomate.com/environments/Default-62ccb864-6a1a-4b5d-8e1c-397dec1a8258/flows"


# -----------------------------------------------------------------------------
# ServiceNow
# -----------------------------------------------------------------------------
servicenow:
  base_url: "https://trenterprise.service-now.com/change_request.do"
  list_filter: "active=true^short_description>=Content Rate Extract^ORDERBYshort_description"


# -----------------------------------------------------------------------------
# Deployment Window  (used by Playwright for all environments)
# -----------------------------------------------------------------------------
deployment_times:
  start: "16:20:00"
  end:   "23:30:00"


# -----------------------------------------------------------------------------
# Attendee Groups
# -----------------------------------------------------------------------------
attendee_groups:
  group_cre_lead:
    - radhakrishna.pachipulusu@thomsonreuters.com
    - AashishMono.Kotte@thomsonreuters.com
  group_cre_team:
    - Godzilla@thomsonreuters.com
    - IDTDevOps@thomsonreuters.com
    - IDT-PerfQA@thomsonreuters.com
    - IDT-TechOps@thomsonreuters.com
  group_cre_optional:
    - IDT-ReleaseManagement@thomsonreuters.com


# -----------------------------------------------------------------------------
# Time Slots  (start / end / duration in minutes)
# -----------------------------------------------------------------------------
time_slots:
  slot_30_1245:  { start: "12:45:00", end: "13:15:00", duration: 30  }
  slot_30_1600:  { start: "16:00:00", end: "16:30:00", duration: 30  }
  slot_30_1930:  { start: "19:30:00", end: "20:00:00", duration: 30  }
  slot_60_1930:  { start: "19:30:00", end: "20:30:00", duration: 60  }
  slot_450_1620: { start: "16:20:00", end: "23:50:00", duration: 450 }


# -----------------------------------------------------------------------------
# Form Field Sets  (reusable field lists for meeting flows)
# -----------------------------------------------------------------------------
form_field_sets:
  basic:
    - subject
    - description
    - start_date
    - start_time
    - end_date
    - end_time
    - required_attendees
  basic_with_urls:
    - subject
    - description
    - start_date
    - start_time
    - end_date
    - end_time
    - release_schedule_url
    - release_readiness_url
    - required_attendees
  with_optional:
    - subject
    - description
    - start_date
    - start_time
    - end_date
    - end_time
    - release_schedule_url
    - release_readiness_url
    - required_attendees
    - optional_attendees
  with_retro:
    - subject
    - description
    - start_date
    - start_time
    - end_date
    - end_time
    - release_schedule_url
    - release_readiness_url
    - release_retro_url
    - required_attendees
    - optional_attendees


# -----------------------------------------------------------------------------
# Meeting Definitions
# -----------------------------------------------------------------------------
meetings:
  Inform CRE team about freeze activities:
    flow_name: "CRE->01->Inform CRE team about freeze activities"
    subject_template: "[{release_number}]"
    description_template: "CRE Team Freeze Notification for {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "Inform CRE team about freeze activities"
    time_slot: slot_30_1245
    required_attendees: group_cre_lead
    form_fields: basic

  CRE freeze activities Meeting:
    flow_name: "CRE->01_01->CRE Code freeze activities Meeting"
    subject_template: "[{release_number}]"
    description_template: "CRE Team Freeze Notification for {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "Inform CRE team about freeze activities"
    time_slot: slot_30_1245
    required_attendees: group_cre_team
    optional_attendees: group_cre_optional
    form_fields: with_optional

  Create Change Request:
    flow_name: "CRE->02->Create Change Request"
    subject_template: "[{release_number}]"
    description_template: "CRE Create Change Request for {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "Create Change Request"
    time_slot: slot_30_1245
    required_attendees: group_cre_lead
    form_fields: basic

  Release Retro & Release Scope Review:
    flow_name: "CRE->03->Retro & Release Scope Review Meeting"
    subject_template: "[{release_number}]"
    description_template: "Release Retro & Release Scope Review for CRE {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "Release Retro & Code Freeze"
    time_slot: slot_60_1930
    required_attendees: group_cre_team
    optional_attendees: group_cre_optional
    form_fields: with_retro

  QA Env Sign off:
