    subject_template: "[{release_number}]"
    description_template: "System Acceptance Testing Sign-off for CRE {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "SAT Sign off"
    time_slot: slot_30_1600
    required_attendees: group_cre_lead
    form_fields: basic

  UAT Readiness:
