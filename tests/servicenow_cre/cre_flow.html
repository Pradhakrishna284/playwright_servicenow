<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRE Test Automation Flow</title>
<style>
  :root {
    --bg: #f8f7f4;
    --bg2: #ffffff;
    --border: rgba(0,0,0,0.10);
    --border2: rgba(0,0,0,0.18);
    --text-primary: #1a1a18;
    --text-secondary: #5a5a56;
    --text-tertiary: #9a9a94;
    --gray-50: #F1EFE8; --gray-600: #5F5E5A; --gray-800: #444441;
    --teal-50: #E1F5EE; --teal-600: #0F6E56; --teal-800: #085041;
    --purple-50: #EEEDFE; --purple-600: #534AB7; --purple-800: #3C3489;
    --amber-50: #FAEEDA; --amber-600: #854F0B; --amber-800: #633806;
    --blue-50: #E6F1FB; --blue-600: #185FA5; --blue-800: #0C447C;
    --coral-50: #FAECE7; --coral-600: #993C1D; --coral-800: #712B13;
    --green-50: #EAF3DE; --green-600: #3B6D11; --green-800: #27500A;
    --red-50: #FCEBEB; --red-600: #A32D2D; --red-800: #791F1F;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --bg2: #242422;
      --border: rgba(255,255,255,0.10); --border2: rgba(255,255,255,0.18);
      --text-primary: #e8e6de; --text-secondary: #a0a09a; --text-tertiary: #60605a;
      --gray-50: #2C2C2A; --gray-600: #B4B2A9; --gray-800: #D3D1C7;
      --teal-50: #04342C; --teal-600: #5DCAA5; --teal-800: #9FE1CB;
      --purple-50: #26215C; --purple-600: #AFA9EC; --purple-800: #CECBF6;
      --amber-50: #412402; --amber-600: #EF9F27; --amber-800: #FAC775;
      --blue-50: #042C53; --blue-600: #85B7EB; --blue-800: #B5D4F4;
      --coral-50: #4A1B0C; --coral-600: #F0997B; --coral-800: #F5C4B3;
      --green-50: #173404; --green-600: #97C459; --green-800: #C0DD97;
      --red-50: #501313; --red-600: #F09595; --red-800: #F7C1C1;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    padding: 32px 16px 64px;
  }

  header {
    max-width: 780px;
    margin: 0 auto 32px;
  }
  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  header p {
    font-size: 13px;
    color: var(--text-tertiary);
  }

  .diagram-wrap {
    max-width: 780px;
    margin: 0 auto;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 24px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.06);
  }

  svg { display: block; width: 100%; }

  /* Node hover */
  .node { cursor: pointer; }
  .node:hover rect, .node:hover polygon { opacity: 0.82; }

  /* Phase labels */
  .phase-label { font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--text-tertiary); }
  .phase-line { stroke: var(--border2); stroke-width: 0.5; }

  /* Text classes */
  .th { font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--text-primary); }
  .ts { font-family: 'DM Sans', system-ui, sans-serif; font-size: 11px; font-weight: 400; fill: var(--text-secondary); }

  /* Color nodes */
  .c-gray    rect, .c-gray    polygon { fill: var(--gray-50);   stroke: var(--gray-600); }
  .c-gray    .th { fill: var(--gray-800); } .c-gray .ts { fill: var(--gray-600); }
  .c-teal    rect, .c-teal    polygon { fill: var(--teal-50);   stroke: var(--teal-600); }
  .c-teal    .th { fill: var(--teal-800); } .c-teal .ts { fill: var(--teal-600); }
  .c-purple  rect, .c-purple  polygon { fill: var(--purple-50); stroke: var(--purple-600); }
  .c-purple  .th { fill: var(--purple-800); } .c-purple .ts { fill: var(--purple-600); }
  .c-amber   rect, .c-amber   polygon { fill: var(--amber-50);  stroke: var(--amber-600); }
  .c-amber   .th { fill: var(--amber-800); } .c-amber .ts { fill: var(--amber-600); }
  .c-blue    rect, .c-blue    polygon { fill: var(--blue-50);   stroke: var(--blue-600); }
  .c-blue    .th { fill: var(--blue-800); } .c-blue .ts { fill: var(--blue-600); }
  .c-coral   rect, .c-coral   polygon { fill: var(--coral-50);  stroke: var(--coral-600); }
  .c-coral   .th { fill: var(--coral-800); } .c-coral .ts { fill: var(--coral-600); }
  .c-green   rect, .c-green   polygon { fill: var(--green-50);  stroke: var(--green-600); }
  .c-green   .th { fill: var(--green-800); } .c-green .ts { fill: var(--green-600); }
  .c-red     rect, .c-red     polygon { fill: var(--red-50);    stroke: var(--red-600); }
  .c-red     .th { fill: var(--red-800); } .c-red .ts { fill: var(--red-600); }

  .arr { stroke: var(--border2); stroke-width: 1.2; fill: none; }

  /* Tooltip */
  #tooltip {
    position: fixed;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text-secondary);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 220px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    z-index: 100;
  }
  #tooltip.show { opacity: 1; }

  footer {
    max-width: 780px;
    margin: 16px auto 0;
    font-size: 11px;
    color: var(--text-tertiary);
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid; flex-shrink: 0; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1>CRE Test Automation — End-to-End Flow</h1>
  <p>Playwright · ServiceNow · 5 environments · Parallel execution &nbsp;·&nbsp; Hover nodes for details</p>
</header>

<div class="diagram-wrap">
<svg viewBox="0 0 680 1420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>CRE test automation end-to-end flow</title>
  <desc>Flowchart: SSO setup → parallel 5-env fan-out → 11-step CR creation per environment</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- SETUP phase -->
  <text class="phase-label" x="40" y="38">Setup</text>
  <line class="phase-line" x1="40" y1="44" x2="640" y2="44"/>

  <g class="node c-gray" data-tip="Set $env:RELEASE_VERSION before running the test suite">
    <rect x="200" y="56" width="280" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="72" text-anchor="middle" dominant-baseline="central">Set RELEASE_VERSION env var</text>
    <text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central">e.g. 2026.05.00</text>
  </g>

  <line x1="340" y1="100" x2="340" y2="124" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-teal" data-tip="js-yaml loads the file; Zod validates every date (DD-MM-YYYY) and time (HH:MM:SS). Bad formats throw immediately.">
    <rect x="160" y="124" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="144" text-anchor="middle" dominant-baseline="central">Load cre_release_schedule.yaml</text>
    <text class="ts" x="340" y="162" text-anchor="middle" dominant-baseline="central">Zod validates dates (DD-MM-YYYY) + times</text>
  </g>

  <line x1="340" y1="180" x2="340" y2="204" class="arr" marker-end="url(#arrow)"/>

  <g class="node" data-tip="Zod safeParse() — on failure, all field paths + messages are printed and the process exits before any browser opens.">
    <polygon points="340,204 420,232 340,260 260,232" style="fill:var(--gray-50);stroke:var(--gray-600);stroke-width:0.5"/>
    <text class="ts" x="340" y="236" text-anchor="middle" dominant-baseline="central" style="fill:var(--text-primary)">Valid?</text>
  </g>

  <line x1="420" y1="232" x2="536" y2="232" class="arr" marker-end="url(#arrow)" style="stroke:#A32D2D"/>
  <text class="ts" x="472" y="224" text-anchor="middle" style="fill:var(--red-600)">No</text>
  <g class="node c-red" data-tip="Throws with clear message: shows every bad field path + expected format. No test runs.">
    <rect x="537" y="210" width="100" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="587" y="226" text-anchor="middle" dominant-baseline="central">Throw error</text>
    <text class="ts" x="587" y="244" text-anchor="middle" dominant-baseline="central">Clear message</text>
  </g>

  <line x1="340" y1="260" x2="340" y2="284" class="arr" marker-end="url(#arrow)" style="stroke:#3B6D11"/>
  <text class="ts" x="352" y="276" style="fill:var(--green-600)">Yes</text>

  <g class="node c-teal" data-tip="buildConfig() constructs EnvironmentTestData for all 5 keys: SAT, UAT_EMEA, UAT_AMER, PROD_EMEA, PROD_AMER — pulling planned dates from the parsed schedule.">
    <rect x="160" y="284" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="304" text-anchor="middle" dominant-baseline="central">Build TEST_CONFIGURATIONS</text>
    <text class="ts" x="340" y="322" text-anchor="middle" dominant-baseline="central">5 configs: SAT · UAT_EMEA · UAT_AMER · PROD_EMEA · PROD_AMER</text>
  </g>

  <line x1="340" y1="340" x2="340" y2="364" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-purple" data-tip="Runs once. Navigates to SSO, fills credentials from .env, waits up to 2 min for PingID MFA push, then saves session to auth_servicenow.json (valid 8 hrs).">
    <rect x="160" y="364" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="384" text-anchor="middle" dominant-baseline="central">SSO setup (runs once)</text>
    <text class="ts" x="340" y="402" text-anchor="middle" dominant-baseline="central">Login → PingID MFA → save auth_servicenow.json (8 h TTL)</text>
  </g>

  <!-- PARALLEL EXECUTION phase -->
  <line x1="340" y1="420" x2="340" y2="444" class="arr" marker-end="url(#arrow)"/>
  <text class="phase-label" x="40" y="462">Parallel execution  (fullyParallel: true — 5 workers)</text>
  <line class="phase-line" x1="40" y1="468" x2="640" y2="468"/>

  <line x1="340" y1="444" x2="340" y2="484" style="stroke:var(--border2);stroke-width:0.5"/>
  <line x1="68" y1="484" x2="612" y2="484" style="stroke:var(--border2);stroke-width:0.5"/>

  <line x1="68"  y1="484" x2="68"  y2="504" style="stroke:var(--border2);stroke-width:0.5"/>
  <line x1="178" y1="484" x2="178" y2="504" style="stroke:var(--border2);stroke-width:0.5"/>
  <line x1="340" y1="484" x2="340" y2="504" style="stroke:var(--border2);stroke-width:0.5"/>
  <line x1="502" y1="484" x2="502" y2="504" style="stroke:var(--border2);stroke-width:0.5"/>
  <line x1="612" y1="484" x2="612" y2="504" style="stroke:var(--border2);stroke-width:0.5"/>

  <g class="node c-amber" data-tip="SAT: RM step 0 + DevOps steps 1-2 (AWS deploy + OCI QA). No TechOps or QA CTasks.">
    <rect x="20"  y="504" width="96" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="68"  y="520" text-anchor="middle" dominant-baseline="central">SAT</text>
    <text class="ts" x="68"  y="538" text-anchor="middle" dominant-baseline="central">AWS + OCI QA</text>
  </g>
  <g class="node c-blue" data-tip="UAT EMEA: RM step 0 + TechOps steps 1-2 (LB changes + deploy). QA step 3.">
    <rect x="130" y="504" width="96" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="178" y="520" text-anchor="middle" dominant-baseline="central">UAT EMEA</text>
    <text class="ts" x="178" y="538" text-anchor="middle" dominant-baseline="central">AWS EMEA</text>
  </g>
  <g class="node c-blue" data-tip="UAT AMER: RM step 0 + TechOps steps 1-4 (AWS LB, OCI LB, AWS deploy, OCI deploy). QA step 5.">
    <rect x="292" y="504" width="96" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="520" text-anchor="middle" dominant-baseline="central">UAT AMER</text>
    <text class="ts" x="340" y="538" text-anchor="middle" dominant-baseline="central">AWS + OCI AMER</text>
  </g>
  <g class="node c-coral" data-tip="PROD EMEA: same CTask structure as UAT EMEA — RM + TechOps + QA.">
    <rect x="454" y="504" width="96" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="502" y="520" text-anchor="middle" dominant-baseline="central">PROD EMEA</text>
    <text class="ts" x="502" y="538" text-anchor="middle" dominant-baseline="central">AWS EMEA</text>
  </g>
  <g class="node c-coral" data-tip="PROD AMER: same CTask structure as UAT AMER — most steps, includes OCI alongside AWS.">
    <rect x="564" y="504" width="96" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="612" y="520" text-anchor="middle" dominant-baseline="central">PROD AMER</text>
    <text class="ts" x="612" y="538" text-anchor="middle" dominant-baseline="central">AWS + OCI AMER</text>
  </g>

  <line x1="68"  y1="548" x2="68"  y2="568" style="stroke:var(--border2);stroke-width:0.5"/>
  <line x1="178" y1="548" x2="178" y2="568" style="stroke:var(--border2);stroke-width:0.5"/>
  <line x1="340" y1="548" x2="340" y2="568" style="stroke:var(--border2);stroke-width:0.5"/>
  <line x1="502" y1="548" x2="502" y2="568" style="stroke:var(--border2);stroke-width:0.5"/>
  <line x1="612" y1="548" x2="612" y2="568" style="stroke:var(--border2);stroke-width:0.5"/>
  <line x1="68" y1="568" x2="612" y2="568" style="stroke:var(--border2);stroke-width:0.5"/>
  <line x1="340" y1="568" x2="340" y2="588" class="arr" marker-end="url(#arrow)"/>

  <!-- PER-ENV STEPS phase -->
  <text class="phase-label" x="40" y="606">Per-environment test steps  (same 11 steps for all 5 workers)</text>
  <line class="phase-line" x1="40" y1="612" x2="640" y2="612"/>

  <g class="node c-gray" data-tip="storageState fixture injects auth_servicenow.json into the browser context — no SSO redirect occurs. If auth_servicenow.json is stale (&gt;8h), re-run sso_setup.ts first.">
    <rect x="160" y="620" width="360" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="636" text-anchor="middle" dominant-baseline="central">1. Reuse auth_servicenow.json session</text>
    <text class="ts" x="340" y="654" text-anchor="middle" dominant-baseline="central">storageState fixture — no per-test login</text>
  </g>
  <line x1="340" y1="664" x2="340" y2="684" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-purple" data-tip="Navigates to the base ServiceNow URL. Uses scrollMenuUntil() to find the Change module in the sidebar nav — handles lazy-loaded menus.">
    <rect x="160" y="684" width="360" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="700" text-anchor="middle" dominant-baseline="central">2. Navigate to Change Management</text>
    <text class="ts" x="340" y="718" text-anchor="middle" dominant-baseline="central">ServiceNow sidebar → Change module</text>
  </g>
  <line x1="340" y1="728" x2="340" y2="748" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-purple" data-tip="Clicks 'Normal' in the change model selector iframe. Waits for the text to be visible before clicking.">
    <rect x="160" y="748" width="360" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="764" text-anchor="middle" dominant-baseline="central">3. Select Normal change model</text>
    <text class="ts" x="340" y="782" text-anchor="middle" dominant-baseline="central">Click "Normal" in change model iframe</text>
  </g>
  <line x1="340" y1="792" x2="340" y2="812" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-gray" data-tip="Asserts URL matches /change_request.do.*chg_model.*type.*normal/i — confirms the form loaded with the correct model type.">
    <rect x="160" y="812" width="360" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="828" text-anchor="middle" dominant-baseline="central">4. Verify CR form URL</text>
    <text class="ts" x="340" y="846" text-anchor="middle" dominant-baseline="central">change_request.do + chg_model + normal</text>
  </g>
  <line x1="340" y1="856" x2="340" y2="876" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-teal" data-tip="fillMainForm() + fillAndSubmitCR(): category, business service, config item, planned dates, short/detailed description, justification, implementation plan, risk analysis, backout plan, test plan, approval groups.">
    <rect x="160" y="876" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="896" text-anchor="middle" dominant-baseline="central">5. Fill + submit CR form</text>
    <text class="ts" x="340" y="914" text-anchor="middle" dominant-baseline="central">Category, service, dates, descriptions, approval groups</text>
  </g>
  <line x1="340" y1="932" x2="340" y2="952" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-gray" data-tip="After submit, ServiceNow redirects to sn_chg_model_ui_landing.do. Test waits for the Normal tile to reappear — confirms clean return.">
    <rect x="160" y="952" width="360" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="968" text-anchor="middle" dominant-baseline="central">6. Wait for post-submit redirect</text>
    <text class="ts" x="340" y="986" text-anchor="middle" dominant-baseline="central">Returns to Change Model landing page</text>
  </g>
  <line x1="340" y1="996" x2="340" y2="1016" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-purple" data-tip="Opens the All menu, scrolls the collapsible nav list until the 'Open' item under Change is visible, then clicks it.">
    <rect x="160" y="1016" width="360" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1032" text-anchor="middle" dominant-baseline="central">7. Navigate to Open CRs list</text>
    <text class="ts" x="340" y="1050" text-anchor="middle" dominant-baseline="central">All menu → Change → Open</text>
  </g>
  <line x1="340" y1="1060" x2="340" y2="1080" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-teal" data-tip="Searches the CR list by number (captured during form submit), asserts the row is visible, then clicks into the CR detail record.">
    <rect x="160" y="1080" width="360" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1096" text-anchor="middle" dominant-baseline="central">8. Search + verify CR in list</text>
    <text class="ts" x="340" y="1114" text-anchor="middle" dominant-baseline="central">Search by CR number, assert row visible</text>
  </g>
  <line x1="340" y1="1124" x2="340" y2="1144" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-teal" data-tip="Loops through all CTasks (RM → DevOps → TechOps → QA). Each iteration: click Change Tasks tab → New → fill form → submit → verify redirect back to CR. Step count varies by env + region.">
    <rect x="160" y="1144" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1164" text-anchor="middle" dominant-baseline="central">9. Create CTasks for all departments</text>
    <text class="ts" x="340" y="1182" text-anchor="middle" dominant-baseline="central">RM, DevOps, TechOps, QA — steps vary by env + region</text>
  </g>
  <line x1="340" y1="1200" x2="340" y2="1220" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-amber" data-tip="createRiskAssessmentTask() — fills the risk assessment form attached to the CR.">
    <rect x="160" y="1220" width="360" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1236" text-anchor="middle" dominant-baseline="central">10. Create Risk Assessment</text>
    <text class="ts" x="340" y="1254" text-anchor="middle" dominant-baseline="central">createRiskAssessmentTask()</text>
  </g>
  <line x1="340" y1="1264" x2="340" y2="1284" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-green" data-tip="Tries clicking button#state_model_request_assess_approval. Falls back to calling moveToAssess() via page.evaluate() if the button click fails.">
    <rect x="160" y="1284" width="360" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="1304" text-anchor="middle" dominant-baseline="central">11. Submit for Assess</text>
    <text class="ts" x="340" y="1322" text-anchor="middle" dominant-baseline="central">Button click → JS fallback (moveToAssess)</text>
  </g>
  <line x1="340" y1="1340" x2="340" y2="1360" class="arr" marker-end="url(#arrow)"/>

  <g class="node c-gray" data-tip="ChangeRequestStorage.save() writes crNumber, crUrl, sysId, timestamp, configName to change_request_registry.yaml keyed by release version.">
    <rect x="160" y="1360" width="360" height="44" rx="8" stroke-width="0.5"/>

<div id="tooltip"></div>

<script>
  const tip = document.getElementById('tooltip');
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', e => {
      tip.textContent = el.dataset.tip;
      tip.classList.add('show');
    });
    el.addEventListener('mousemove', e => {
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top  = (e.clientY - 8)  + 'px';
    });
    el.addEventListener('mouseleave', () => tip.classList.remove('show'));
  });
</script>
