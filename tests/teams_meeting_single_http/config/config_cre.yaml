# -----------------------------------------------------------------------------
# Change Request Registry
# Auto-maintained by Playwright (testDataConfig_CRE.ts → ChangeRequestStorage)
# Format per entry:
#   crNumber:       CHG0XXXXXX
#   crUrl:          https://trenterprise.service-now.com/change_request.do?...
#   crSysId:        <32-char hex>  (present only when sys_id was captured post-submit)
#   timestamp:      ISO-8601
#   configName:     SAT | UAT_EMEA | UAT_MENA | UAT_AMER | PROD_EMEA | PROD_MENA | PROD_AMER
#   releaseVersion: YYYY.MM.00
# -----------------------------------------------------------------------------
change_request_registry: {}