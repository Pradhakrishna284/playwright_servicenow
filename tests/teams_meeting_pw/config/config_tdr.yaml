# ============================================================
#  TDR (Tax Data Repository) — Release Automation Config
#  FY 2026
# ============================================================
#
# NOTE — Prod Deployment dates:
#   The official release schedule lists the "go/no-go" milestone date (e.g. Thu).
#   The actual PROD deployment window is 08:00–11:00 IST the FOLLOWING day (e.g. Fri).
#   Dates in the schedule below reflect the actual execution date (+1 day from
#   the official schedule), so that calendar invites and ADO sprints are correct.

power_automate:
  url: "https://make.powerautomate.com/environments/Default-62ccb864-6a1a-4b5d-8e1c-397dec1a8258/flows"

