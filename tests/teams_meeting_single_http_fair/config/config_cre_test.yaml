# ============================================================
#  CRE (Content Rate Extract) — Release Automation Config — TEST
#  FY 2026
# ============================================================
#
# NOTE — Prod Deployment dates:
#   The official release schedule lists the "go/no-go" milestone date.
#   The actual PROD deployment window is 16:20–23:50 IST on the scheduled day.
#   Dates in the schedule below reflect the actual execution dates so that
#   calendar invites and ADO sprints are correct.

power_automate:
  url: "https://make.powerautomate.com/environments/Default-62ccb864-6a1a-4b5d-8e1c-397dec1a8258/flows"
  # ⚠ SECURITY — these webhook URLs grant anyone the ability to trigger your flows.
  # Do NOT commit live URLs to a public or shared repository.
  # Treat them like passwords: rotate them if leaked.
  # ── Shared cancel flow ───────────────────────────────────────
  # One single Power Automate flow handles cancellation for ALL meetings.
  # It receives subject + start_datetime, finds the matching calendar event,
  # and deletes it. Paste the HTTP trigger URL here once the flow is set up,
  # and it will automatically apply to every meeting below.
  cancel_flow_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/339ea7a91ded461d8d3fd3923c2e69b8/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=wnXCQsKBB6N5gVzM-TsPIde_e-sZ_N7RfS5CN3_xfyQ"

  # ── Shared create flow ───────────────────────────────────────
  # One single Power Automate flow handles creation of ALL meetings.
  # It receives all fields and creates the Teams meeting. Paste the
  # HTTP trigger URL here once the flow is set up.
  create_flow_url: "https://default62ccb8646a1a4b5d8e1c397dec1a82.58.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/fba1253d38ae42bcac4cde00b8756060/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=Q_9uZa8jo361dwgyz_WXhtrzn9p-56B9WEz1h66f6nw"

# -----------------------------------------------------------------------------
# Attendee Groups
# -----------------------------------------------------------------------------
attendee_groups:
  group_cre_test:
    - radhakrishna.pachipulusu@thomsonreuters.com
    - AashishMono.Kotte@thomsonreuters.com
  group_cre_optional:
    - Dhruv.Rajpurohit@thomsonreuters.com

# -----------------------------------------------------------------------------
# Time Slots  (start / end / duration in minutes)
# -----------------------------------------------------------------------------
time_slots:
  slot_30_1245:  { start: "12:45:00", end: "13:15:00", duration: 30 }
  slot_30_1600:  { start: "16:00:00", end: "16:30:00", duration: 30 }
  slot_30_1930:  { start: "19:30:00", end: "20:00:00", duration: 30 }
  slot_60_1930:  { start: "19:30:00", end: "20:30:00", duration: 60 }
  slot_450_1620: { start: "16:20:00", end: "23:50:00", duration: 450 }

# -----------------------------------------------------------------------------
# Meeting Definitions
# schedule_column must match a column key in releases.schedule entries below.
# time_slot must match a key in time_slots above.
# -----------------------------------------------------------------------------
meetings:
  Inform CRE team about freeze activities:
    subject_template: "[Reminder] - {project_full_name} | {project_tag} | Inform CRE team about freeze activities"
    description_template: "CRE Team Freeze Notification for {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "Inform CRE team about freeze activities"
    time_slot: $slot_30_1245
    required_attendees: $group_cre_test

  CRE freeze activities Meeting:
    subject_template: "[Meeting] - {project_full_name} | {project_tag} | Code Freeze Activities Meeting"
    description_template: "CRE Team Freeze Notification for {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "Inform CRE team about freeze activities"
    time_slot: $slot_30_1245
    required_attendees: $group_cre_test
    optional_attendees: $group_cre_optional

  Create Change Request:
    subject_template: "[Reminder] - {project_full_name} | {project_tag} | Create Change Request"
    description_template: "CRE Create Change Request for {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "Create Change Request"
    time_slot: $slot_30_1245
    required_attendees: $group_cre_test

  Release Retro & Release Scope Review:
    subject_template: "[Meeting] - {project_full_name} | {project_tag} | Release Retro & Release Scope Review"
    description_template: "Release Retro & Release Scope Review for CRE {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "Release Retro & Code Freeze"
    time_slot: $slot_60_1930
    required_attendees: $group_cre_test
    optional_attendees: $group_cre_optional

  QA Sign off:
    subject_template: "[Reminder] - {project_full_name} | {project_tag} | QA Sign-Off"
    description_template: "QA Environment Sign-off for CRE {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "QA Sign off"
    time_slot: $slot_30_1600
    required_attendees: $group_cre_test

  Generate Security Score Card:
    subject_template: "[Reminder] - {project_full_name} | {project_tag} | Generate Security Score Card"
    description_template: "Generate Security Score Card for CRE {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "Generate Security Score Card"
    time_slot: $slot_30_1600
    required_attendees: $group_cre_test

  Reminder to cut Release branch:
    subject_template: "[Reminder] - {project_full_name} | {project_tag} | Reminder to cut Release branch"
    description_template: "Reminder to cut Release branch for CRE {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "Reminder to cut Release branch"
    time_slot: $slot_30_1600
    required_attendees: $group_cre_test

  Deployment SAT:
    subject_template: "[Deployment] - {project_full_name} | {project_tag} | APP | AWS SAT & OCI QA ({build_version})"
    description_template: "System Acceptance Testing - Application for CRE {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "SAT APP"
    time_slot: $slot_450_1620
    required_attendees: $group_cre_test
    optional_attendees: $group_cre_optional

  SAT Sign off:
    subject_template: "[Reminder] - {project_full_name} | {project_tag} | SAT Sign-Off"
    description_template: "System Acceptance Testing Sign-off for CRE {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "SAT Sign off"
    time_slot: $slot_30_1600
    required_attendees: $group_cre_test

  UAT Readiness:
    subject_template: "[Meeting] - {project_full_name} | {project_tag} | UAT Readiness Meeting"
    description_template: "UAT Readiness Meeting for CRE {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "UAT Readiness"
    time_slot: $slot_30_1930
    required_attendees: $group_cre_test
    optional_attendees: $group_cre_optional

  UAT EMEA:
    subject_template: "[Deployment] - {project_full_name} | {project_tag} | UAT | EMEA ({build_version})"
    description_template: "UAT Testing - EMEA Region for CRE {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "UAT EMEA"
    time_slot: $slot_450_1620
    required_attendees: $group_cre_test
    optional_attendees: $group_cre_optional

  UAT MENA:
    subject_template: "[Deployment] - {project_full_name} | {project_tag} | UAT | MENA ({build_version})"
    description_template: "UAT Testing - MENA Region for CRE {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "UAT MENA"
    time_slot: $slot_450_1620
    required_attendees: $group_cre_test
    optional_attendees: $group_cre_optional

  UAT AMER:
