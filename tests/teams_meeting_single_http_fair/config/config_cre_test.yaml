    description_template: "UAT Testing - AMER Region for CRE {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "UAT AMER"
    time_slot: $slot_450_1620
    required_attendees: $group_cre_test
    optional_attendees: $group_cre_optional

  PROD Readiness:
    subject_template: "[Meeting] - {project_full_name} | {project_tag} | PROD Readiness Meeting"
    description_template: "Production Readiness Meeting for CRE {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "PROD Readiness"
    time_slot: $slot_30_1930
    required_attendees: $group_cre_test
    optional_attendees: $group_cre_optional

  PROD EMEA:
    subject_template: "[Deployment] - {project_full_name} | {project_tag} | PROD | EMEA ({build_version})"
    description_template: "Production Deployment - EMEA Region for CRE {release_number}\nSchedule: {release_schedule_url}"
    schedule_column: "PROD EMEA"
    time_slot: $slot_450_1620
    required_attendees: $group_cre_test
    optional_attendees: $group_cre_optional

  PROD MENA:
